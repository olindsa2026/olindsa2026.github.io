        "content": "Oral QuizzesOur first oral quiz will be assigned next Thursday (the 9th) and due the Thursday after that.  This is not at all required, but I will open up some practice spots for people if they want to get a flavor for what the oral quizzes will be like.  Look for those to be posted tomorrow and be scheduled for early next week.Class OverviewLast class we saw heap sort, merge sort, and selection sort, but there are many more to learn about. Today we’ll learn a few more sorting algorithms, but we’ll also formally introduce the master theorem as a generalizable way to find $\\Theta$ for divide and conquer algorithms.  There’s an optional section at the end on the speed limit of sorting (if you are interested).  That content is not part of the assignments or oral quizzes.Master TheoremA generalizable recipe for analyzing divide and conquer algorithms is the master theorem.  Remember, by divide and conquer all we mean is that we divide the problem into smaller subproblems, solve the subproblems recursively, and use the solutions to the subproblems to determine the solution to the original problem.Let’s see if we can apply this to determining the complexity of merge sort from last class.  Before applying the master theorem, we need to make sure we are comfortable with the idea of a recurrence relation.  A recurrence relation relates the runtime of an algorithm on input of size $n$ (denoted as $T(n)$) to the runtime of the algorithm on smaller problem sizes (less than $n$).  For example, in the case of merge sort we can write the following recurrence relation.  $T(n) = 2 T(\\frac{n}{2}) + n$Let’s make sure we understand this exactly.  The term on the left is the runtime of sorting $n$ items with merge sort.  The runtime is based on two parts.  The first part is the recursive piece, which consists of merge sorting two lists of size $\\frac{n}{2}$.  The second part is the work needed to reassemble the sorted lists back into an overall sorted list (the merge step), which takes time $n$.The master theorem provides a recipe for us to solve this recurrence relation (meaning determine a function $T(n)$ that satisfies the equation).  The master theorem solves recurrence relations of the following form.  $T(n) = a T(\\frac{n}{b}) + f(n)$You should see that for merge sort, $a=2$, $b=2$, and $f(n) = n$.In order to apply the master theorem, we compute a value called $c_{crit} = \\log_{b}{a}$.  Plugging in $a=2$ and $b=2$, we get $c_{crit} = \\log_2{2} = 1$.Now, we have to determine which of the three cases of the master theorem applies. Before doing so, let’s remember our order of growth.  Refresher: $O, \\Omega, \\Theta$  Let’s make sure we remember what our old friend $O$, $\\Omega$, and $O$ mean.  I’ll state these definitions somewhat loosely, trusting you to go back to the original definitions for the exact meanings.      $f(n) = O(g(n))$ means that $g(n)$ bounds $f(n)$ from above for large $n$.    $f(n) = \\Omega(g(n))$ means that $g(n)$ bounds $f(n)$ from below for large $n$.    $f(n) = \\Theta(g(n))$ means that $g(n)$ bounds $f(n)$ from both above and below (meaning $f(n) = O(g(n))$ and $f(n) = \\Omega(g(n))$).  Okay, so here are the three cases of the master theorem.  I’ll list the condition, state if merge sort meets it, and if it does, show the runtime.  To apply this to other problems, you will need to look back at the more general versions of these cases.Case 1: $n = O(n^c)$ for some $c &lt; 1$.  Nope can’t be true.  If $c$ is less than 1, it grows more slowly than $n$ and cannot be bounded from above.Case 2: $n = \\Theta(n (\\log n)^k)$ for some $k \\geq 0$.  Yes!  If we set $k=0$, then the $\\log$ drops out, and we are left with $n = \\Theta(n)$, which is true.Case 3: $n = \\Omega(n^c)$ for some $c &gt; 1$.  Nope.  If we set $c$ bigger than 1, it will grow faster than $n$ and won’t bound $n$ from below.Okay, so case 2 is the winner.  The runtime as dictated by case 2 is $T(n) = \\Theta(n^{c_{crit}} (\\log n)^{k+1}) = \\Theta(n \\log n)$ (since $c_{crit} = 1$ and $k = 0$).  Exercise 1: Reanalyze binary search using the master theorem.  Hint: first find a recurrence relation, and then try to find the case that matches.At first the formulas for the master theorem might seem a bit strange, but one quantity that comes up, $n^{c_{crit}}$, is related to the number of nodes in the recursive tree when you apply a divide and conquer strategy.  For example, if we had $a = 4$ and $b=2$, the following tree would have approximately $n^2$ nodes.graph TD  r[n] --&gt; b[n/2]  r --&gt; c[n/2]  r --&gt; d[n/2]  r --&gt; f[n/2]  b --&gt; g[n/4]  b --&gt; h[n/4]  b --&gt; i[n/4]  b --&gt; j[n/4]  c --&gt; k[n/4]  c --&gt; l[n/4]  c --&gt; m[n/4]  c --&gt; n[n/4]  d --&gt; o[n/4]  d --&gt; p[n/4]  d --&gt; q[n/4]  d --&gt; s[n/4]  f --&gt; t[n/4]  f --&gt; u[n/4]  f --&gt; v[n/4]  f --&gt; w[n/4]  Exercise 2: Choose a few problems from the homework and do them together.  If you want to hit each case at least once, try these three.      Problem 1-5    Problem 1-21    Problem 1-23  Quick SortQuick Sort is one of the most commonly used sorting algorithms.There are quite a few ways to implement Quick Sort, but the general idea is the following:  For an unsorted list, choose an element of the list as your pivot value, $p$.  Iterate through the elements of your list ($x_1, x_2, \\ldots, x_n$), swapping as needed, until the pivot element is located at index $i$ and $x_j &lt; x_i$ if $j &lt; i$ and $a_j \\geq a_i$ if $j \\geq i$.  Sort range of elements that are before the pivot in the list and those after the pivot recursively.Let’s look at the algorithm visualization (you can choose quick or quick sort or random quick sort).Analyzing the runtime of this algorithm is a bit tricky.  Let’s consider a specific case of always choosing the first element as the pivot.  Let’s see what happens with quick sort with this pivot selection rule.Radix SortRadix sort (also called bucket sort) is an interesting algorithm where we don’t perform an explicit comparisons between elements in our list.  We instead sort, e.g. if we are sorting integers, based on comparing the ones digits, then the tens digit, etc.  Let’s check out the visualization of Radix sort at our favorite website!  Choose Rad, and then click the sort button.The complexity of radix sort is $\\Theta(nk)$ where $k$ is the number of digits (or chunks) that each element can be broken into (e.g., if our list had numbers with 4 or fewer digits, $k$ would be $4$).The Speed Limit for Comparison-Based Sorting  This is an optional writeup for those that are interested in going through the details.  To understand this, you need to know some basic facts from discrete math.  I’ll highlight those in the writeup.  I will not be going over the details in class.There’s a theorem that states that any algorithm for sorting that works by comparing elements of the list to each other has a running time of $\\Omega(n \\log n)$ (i.e., the running time can be bounded below by $n \\log n$).  We can think of $n \\log n$ as a speed limit for any sorting algorithm that relies on comparisons.The basic idea is to shift how you think about sorting a list of $n$ items.  Instead of thinking of reordering the items such that the list is sorted, let’s think about sorting as the problem of determining a function that maps indices from the unsorted list to where they should go in the sorted list.  Here’s an example.Suppose we have a list $x = [3, 9, 2, 10]$.  A function that sorts the list specifies a mapping from the original indices ($0, 1, 2, 3$) to their positions in the sorted list.  A function $f$ that achieves thi goal could be defined as follows.\\[\\begin{align*}f(0) &amp;= 1,~\\text{since 3 would appear at index 1 in the sorted list} \\\\f(1) &amp;= 2,~\\text{since 9 would appear at index 2 in the sorted list} \\\\f(2) &amp;= 0,~\\text{since 2 would appear at index 0 in the sorted list} \\\\f(3) &amp;= 3,~\\text{since 10 would appear at index 3 in the sorted list}\\end{align*}\\]With this new definition of sorting in mind, let’s think about how many possible functions $f$ there are as a function of $n$.  To determine this, we can imagine that for $f(0)$ there are $n$ possible choices, for $f(1)$ there are $n-1$ possible choices (since we can’t repeat what we chose for $f(0)$), for $f(2)$ there are $n-2$ possible choices, etc.  Overall, we have that the number of choices is $n (n-1)(n-2)\\ldots 1 = n!$.  If you took Discrete, you might recognize this as the number of ways to permute $n$ items (which should line up intuitively with what we are doing here).Now let’s think about what happens when we perform some comparison $x_i &lt; x_j$ for the purposes of determining which of the $n!$ functions will sort our list.  Some proportion will return true to this comparison the others will return false.  By this logic, if you think of the worst case scenario (which is what we consider when thinking about runtime complexity), at best we are left with half as many possible permutations that we are still considering (as compared to before the comparison).Let’s say our sorting algorithm perfectly divides the number of possible permutations that are consistent with each comparison it performs. We can represent this scenario as a tree where at each level of the tree we perform a comparison to try to eliminate some of the $n!$ possible permutations.  The number written on the node in the tree represents the number of permutations that are still under consideration after performing a particular comparison.graph TD  r[n!] --&gt; b[n!/2]  r --&gt; c[n!/2]  b --&gt; e[n!/4]  b --&gt; f[n!/4]  c --&gt; g[n!/4]  c --&gt; h[n!/4]If we were to extend this tree, eventually we would reach leaf nodes where there is exactly $1$ permutation remaining (this would allow us to sort our list).  What is the runtime of this sorting algorithm?  Well, it has to be the number of comparisons, which is given by the height of the tree.  The height of the tree would be $\\log_2(n!)$ (since each level reduces the number of consistent permutations by a factor of $2$).  This shows that the fastest sorting algorithm based on comparisons has to perform at least $\\log_2(n!)$ operations in the worst case.  We could stop here, but we’d like to derive our desired result, which states that all sorting algorithms are $\\Omega(n \\log n)$.To accomplish our goal, we now show that $\\log_2(n!) = \\Omega (n \\log n)$.  To do this we need to find a value $n_0$ and a constant $c$ such that $\\log_2(n!) &gt; c n \\log_2 n$ for $n \\geq n_0$.  Note: I’m using $\\log_2$ here to make it clearer in the proof coming up, but the base of the log doesn’t matter since it’s just a constant factor (that doesn’t affect $\\Omega$).The first fact we use is that $n! &gt; \\left(\\frac{n}{2}\\right)^\\frac{n}{2}$.  This is because the first $\\frac{n}{2}$ terms of $n!$ are all bigger than $\\frac{n}{2}$.\\[\\begin{align*}\\log_2(n!) &amp;&gt; \\log_2\\left (\\frac{n}{2} \\right)^\\frac{n}{2}\\\\&amp;= \\frac{n}{2} (\\log_2(n) - 1) \\\\&amp;\\geq c n \\log_2(n), \\text{for }n\\geq 4, \\text{and }c=\\frac{1}{4}\\end{align*}\\]That’s it!  We’ve shown that $\\log_2(n!) = \\Omega(n \\log_2 n)$, and we have proven our speed limit.",

        "content": "Draft of Oral Quiz 1I have posted the tentative structure for the oral quiz on Canvas.  Please review it and discuss with those around you.  I’ll take some comments, and then finalize it in the next day or so.  The assignment will start on Thursday, October 9th and be due on Thursday, October 16th.Divide and Conquer and Intro to Dynamic ProgrammingToday is going to primarily be about getting practice with divide and conquer algorithms.  We’ll also throw in a recursive algorithm that doesn’t quite fit the mold of divide and conquer.  Exercise 1  Multiplying square matrices.  Given two square matrices, $A$ and $B$, each of size $n \\times n$.  Determine a divide and conquer method for determining the product of the two matrices $C = AB$.  To solve the problem, you can make use of the technique of block matrix multiplication.  Show that the running time you get from using block matrix multiplication is the same as you get from the traditional method of matrix multiplication (the one you learned about in math class).  Exercise 2  Create a divide and conquer algorithm to compute $x^n$ where $n$ is a positive integer.  Consider each multiplication operation as taking $\\Theta(1)$.  What is the runtime of your divide and conquer algorithm?  Hint: you should be able to do better thant $\\Theta(n)$.  How does it compare to the approach of just multiplying $x$ $n$ times.  Exercise 3  Solve the maximum contiguous subsequence problem by determining a divide and conquer algorithm to solve it.  Once you have the algorithm, use the master theorem to determine its runtime.  Note that there are other algorithm you can use to solve this problem (that are actually faster, but here we want to focus on divide and conquer).  The maximum contiguous sub-sequence problem involves taking an input list of numbers $x_1, \\ldots, x_n$ and determining two index values $i$ and $j$ such that $\\sum_{k=i}^j x_k$ is as large as possible.  Note that the numbers can be negative.  For simplicity, you can just return the maximum sum (rather than the indices).  Show / Hide Hint 1           Divide the array into two halves.  Find the maximum subsequence for each half.  What case have you not considered?     Show / Hide Hint 2           Create a special purpose algorithm for determining the maximum crossing sequence.   Dynamic Programming  Let’s start with a very simple recursive function and see if we can use dynamic programming to solve it.  Let’s implement a function to compute the $n$th Fibonacci number.We’ll see if we can understand how this applies to the Leetcode problem of Minimum Cost Climbing Stairs.The book “Introduction Algorithms” by Cormen, Leiserson, Rivest, and Stein has the following description of the dynamic programming approach.  Characterize the structure of an optimal solution.  Recursively define the value of an optimal solution.  Compute the value of an optimal solution, typically in a bottom-up fashion.  Construct an optimal solution from computed information.This can be a helpful way to think about dynamic programming.  Try it on the next problem.  You are given an integer array cost where cost[i] is the cost of $i$th step on a staircase. Once you pay the cost, you can either climb one or two steps.You can either start from the step with index 0, or the step with index 1.Return the minimum cost to reach the top of the floor.  Example 1:      Input: cost = [10,15,20]    Output: 15    Example 2:      Input: cost = [1, 100, 1, 1, 1, 100, 1, 1, 100, 1]    Output: 6    Exercise 4:  Change making.  Given $n$ different coin denominations worth $x_1, x_2, \\ldots, x_n$ cents and a target value of $D$ cents, determine how many different ways you can combine the different coins to add up exactly $D$ cents.  You can use as many of each denomination of coin as you’d like.  Solve the problem using dynamic programming where you create a table to store the solutions to the problem, fill out rows and/or columns of the table that correspond to small or easy to solve instances of the problem, and then determine a rule for filling out the rest of the table.  Finally, determine how you would compute the solution to your original problem by referencing a particular cell in your table.",

        "content": "Oral Quiz 1First, sign up for a time to meet with me (see link on Canvas).  You need to make it to this time unless something catastrophic happens.Here are some things I noticed in the practice quizzes.  When determining runtimes (non divide and conquer), figure out what are the main steps you have to perform, determine how many operations each step takes, and then add up the total number of operations.  Conclude by converting to $\\Theta$.  For divide and conquer algorithms, be ready to draw a tree diagram or use the master theorem.  When reading code, I found that people who talked through what the code as doing in greater detail had an easier time giving the relevant details.  For graph search (e.g., Dijkstra), make sure you understand what the variables represent (e.g., dist[v] returns the shortest known path from the source to vertex v).Dynamic Programming General StructureThe book Introduction Algorithms by Cormen, Leiserson, Rivest, and Stein has the following description of the dynamic programming approach.  Characterize the structure of an optimal solution.  Recursively define the value of an optimal solution.  Compute the value of an optimal solution, typically in a bottom-up fashion.  Construct an optimal solution from computed information.Practice Problems(You won’t be able to do all of these.  This is just for reference.  Turn in what you’d like.)  Exercise 1  Change making.  Given $n$ different coin denominations worth $x_1, x_2, \\ldots, x_n$ cents and a target value of $D$ cents, determine the minimum number of coins you can use to add up exactly $D$ cents.  You can use as many of each denomination of coin as you’d like.  Solve the problem using dynamic programming where you create a table to store the solutions to various subproblems, fill out rows and/or columns of the table that correspond to small or easy to solve subproblem, and then determine a rule for filling out the rest of the table.  Finally, determine how you would compute the solution to your original problem by referencing a particular cell in your table.  Bonus question (if you have time): can you modify your approach to count the number of ways you can make change for $D$ cents.  Exercise 2  The Longest Common Subsequence (LCS) problem asks: given two sequences, what is the longest sequence that appears in both of them in the same order? In other words, it’s the longest sequence that you can form by deleting some elements (without changing the order) from each of the two original sequences.  Exercise 3  Revisit the maximum contiguous subsequence problem from last class.  Instead of using divide and conquer, use dynamic programming.  Solution 3:    Exercise 4  In the 0–1 Knapsack problem, we are given a set of items, each with a weight and a value, and we need to determine the number of each item to include in a collection so that the total weight is less than or equal to a given limit and the total value is as large as possible.  Please note that the items are indivisible; we can either take an item or not (0-1 property). For example,  Input:      value = [ 20, 5, 10, 40, 15, 25 ]    weight = [ 1, 2, 3, 8, 7, 4 ]    W = 10    Output: Knapsack value is 60 value = 20 + 40 = 60 (weight = 1 + 8 = 9 &lt; W)",

        "title": "Day 15: Associative Arrays and Hashing",
        "author": "",
        "category": "",
        "content": "Project ShareoutLet’s take some time and share the results from the individual deep dives.  I’ll take volunteers to come to the front, plug in their computer, and say a little bit about what they wound up doing.Associative ArraysAn associative array is a data structure that stores key / value pairs.  In the basic (vanilla) associative array, we assume that each key can be associated with at most one value.  The types of the keys and values need not be the same, and they need not be integers or even primitive data types (e.g., doubles, floats, ints, shorts).The typical operations supported by an associative array are:      Insert or put: add a new (key, value) pair to the collection, mapping the key to its new value. Any existing mapping is overwritten. The arguments to this operation are the key and the value.    Remove or delete: remove a (key, value) pair from the collection, unmapping a given key from its value. The argument to this operation is the key.    Lookup, find, or get: find the value (if any) that is bound to a given key. The argument to this operation is the key, and the value is returned from the operation. If no value is found, some lookup functions raise an exception, while others return a default value (such as zero, null, or a specific value passed to the constructor).  If these operations look familiar, there’s a good reason.  You’ve actually already been using associative arrays for much of this course (as you’ve done, also, in prior courses like Software Design).  Data structures like Python’s dict and Kotlin’s Map and MutableMap are examples of associative arrays.Straw man Implementations of Associative ArraysLet’s look at two methods of implementing associative arrays.  For simplicity, let’s suppose that $k$ represents the total number of possible keys that can be stored in our associative arrays (e.g., if we were creating an associative array of red, green, blue triples to red, green, blue triples, then $k = 256^3$, assuming $256$ possible values for each color channel).  You can assume that given a particular key, it is easy (meaning it can be done in constant time) to map the key to an integer from $0$ to $k-1$ that represents the key’s identity among the $k$ possible keys.  Secondly let’s use the symbol $n$ to denote the number of elements stored in the associative array thus far.Method 1: Association ListsAn association list stores key / value pairs in a linked list.  Whenever you add a new key / value pair, you just add it to your linked list.  Exercise 1      (a) For an association list, what is the runtime ($\\Theta$) of the operations insert, remove, and lookup (you may find it useful to reference the symbols $k$ and $n$ when constructing your answer)?    (b) What is the space complexity for storing $n$ elements in an association list?  You can use $\\Theta$ to describe the amount of space needed to store the data.  Assume that the values stored in the associative array are of a constant size.    Note: space complexity is similar to runtime but the focus is on how much memory do you use to run the algorithm as a function of problem size.  You can express space complexities in the same way as runtimes (using $\\Theta$).  Show / Hide Hint for (a)   Can you map each of these operations to an operation on a linked list?  If so, try to borrow the time complexities from there.Method 2: Array MapAnother simple method for implementing an associative array is to create an array, $a$, of size $k$ where the value $v$ will be stored at $a[i]$ if the key that maps to index $i$ is associated with the value $v$.  Initially, the array may contain a default value at each index to indicate that there are no values associated with any keys when the associative array is initially created.  Exercise 2      (a) For an array map, what is the runtime ($\\Theta$) of the operations insert, remove, and lookup (you may find it useful to reference the symbols $k$ and $n$ when constructing your answer)?    (b) What is the space complexity for storing $n$ elements in an array map?  You can use $\\Theta$ to describe the amount of space needed to store the data.  Assume that the values stored in the associative array are of a constant size.    Show / Hide Hint for (b)   Does the amount of space needed depend on $n$?  Exercise 3Are either of these two approaches practical?  If so, in what situations would each of them be a good choice for a data structure?  Show / Hide Hint  Consider variables like the size of the key space $k$ and the number of elements stored $n$.Hash mapsThe hash map (or hash table) strikes a balance between the pros and cons of the association list and the array map.  The hash map makes use of an entity called a hash function, which is a function from the key space to an integer in the range $[0, m)$ (where the upper limit $m$ depends on the particular choice of hash function).  For now, we will consider these hash functions to be black boxes.  That is, they take in a key and spit out non-negative number less than $m$.  We’ll look at some specific hash functions in just a bit.Here is an example of how a hash function might be used to implement an associative array.  In this case, we will assume that our hash function maps elements from our key space (names) to integers $0, \\ldots, 15$ (i.e., $m = 16$).  In essence the hash function computes a “bucket” at which to store the value associated with a particular key.credit: Wikimedia (license)This design should bring to mind two questions:  What happens when we insert a key (a name) that happens to map to the same bucket that already contains a value (a phone number)?  Does it matter how we assign keys (the names) to buckets?  Will any scheme do?With respect to question 1, there are two commonly used schemes.  The first is called separate chaining.  In separate chaining, instead of storing the values directly in the buckets, each bucket points to an association list that stores the key-value pairs.  In the example of the phone book, separate chaining would look like this..  credit: Wikimedia (license)Notice how the John Smith and Sandra Dee both map to the same bucket (this is called a collision), which points to a two element association list.  Separate chaining works well when the load factor (defined as the ratio of the number of elements stored, $n$, to the number of buckets, $m$) is less than 3 (citation).  When the load factor exceeds some specified threshold, the table must be rehashed (meaning each element must be reinserted with a new hashing function where with a larger number of buckets).An alternative to separate chaining is direct addressing.  When using direct addressing, we still store the values directly in the buckets (as we did in the simple version of our hash map) and when a collision occurs we simply search for an alternate place to put the value.  There are a number of schemes we can use to find this alternative location, but the simplest of these is called linear probing.In linear probing, when you insert an item and a collision occurs, you simply search ahead in your array into you find an unused bucket and place the value there.  This scheme requires updating your algorithm for lookup and deletion of elements accordingly.  Here is what our running example would look like when using linear probing.  credit: Wikimedia (license)Notice how the colliding elements are now stored in two separate buckets located sequentially in the array.Complexity of OperationsUnder the assumption that we have a good hash function (meaning that the probability it maps a randomly chosen key to a specific bucket is roughly uniform and that there are no discernible patterns in how keys are mapped to buckets) and that the load factor on the table is relatively low, then insertion, deletion, and lookup will all have amortized time complexity of $\\Theta(1)$.  If you remember back to our discussion of array lists, amortized analysis is based on the average number of steps per operation.  For example, an amortized time complexity of $\\Theta(1)$ to insert elements into a hash map means that it takes $\\Theta(n)$ time to insert $n$ elements, and hence the time per insertion is $\\Theta(1)$.Tradeoffs Between Separate Chaining and Linear ProbingLinear probing (as an example of open addressing) has the advantage of using less memory given $m$ buckets and has better locality of reference (meaning you don’t have to follow a pointer to another chunk of memory to find the value for a specified key).  On the downside, the performance of linear probing tanks when the load factor of the table approaches 1 (separate chaining can support load factors above 1).  Linear probing is also very sensitive to the choice of hash function.  For example, if a series of keys inserted into the hash map keys cluster in the same range of buckets, the performance of the hash map will degrade even if the load factors is low.Hash functionsAs alluded to above, we would like our hash function, $h$, to satisfy two key properties.      Injection: for two keys $k_1 \\neq k_2$, the hash function should give different results $h(k_1) \\neq h(k_2)$, with probability $m-1/m$.    Diffusion (stronger than injection): if $k_1 \\neq k_2$, knowing $h(k_1)$ gives no information about $h(k_2)$. For example, if $k_2$ is exactly the same as $k_1$, except for one bit, then every bit in $h(k_2)$ should change with $1/2$ probability compared to $h(k_1)$. Knowing the bits of $h(k_1)$ does not give any information about the bits of $h(k_2)$.              CS 312 Lecture 21              It should be obvious why the first property is important for our hash maps to perform optimally, but why do we care about the second property?There are many specific choices of hash functions.  To understand some of the specific choices of hash function, it helps to think a little bit about how the keys we are storing are represented in a computer’s memory.Fundamentally, all data in a computer is stored in a binary format.  For example, positive integers are represented, as you would expect, by converting them into a base 2 representation (negative numbers can be represented in various ways, for example, using two’s complement).  Some data is fixed length (e.g., Kotlin’s Int, Long, and Short) and some is variable length (e.g., a string).  When designing a hash function, we’ll have to think about to apply it to fixed length and variable length data.A full discussion of hash functions is outside the scope of this course, but here are a few concrete choices to make the ideas concrete.For each of these hash functions, we say that the number of buckets for our hash function is $m$ and $m_b$ is the number of bits required to represent the numbers from $0$ to $m-1$.  If we assume $m$ is a power of two, then $m_b = \\log_2 m$.FoldingFolding algorithms divide the input into chunks of $m_b$ bits and then perform operations on these $m_b$-long bit strings to create the final hash index.  These operations could be additions or bit-wise exclusive or (XOR).For example, suppose we were hashing the integer key $4,234,234,421$ into $m = 256$ buckets.  We would take the integer’s binary representation (in this case $11111100011000010100101000110101_b$) and divide it into four 8-bit chunks (since $\\log_2 m = 8$).  These chunks would be: $00110101_b$, $01001010_b$, $01100001_b$, and $11111100_b$.  We could then use X-OR to combine these values chunk by chunk.  Note: xor is exclusive or, which we denote using the $\\oplus$ operator.\\[\\begin{align*}00110101_b \\oplus 01001010_b &amp;= 01111111_b &amp; \\text{xor chunk 1 and 2} \\\\01111111_b \\oplus 01100001_b &amp;= 00011110_b &amp; \\text{take result and xor with chunk 3} \\\\  00011110_b \\oplus 11111100_b &amp;= 11100010_b  &amp; \\text{take result and xor with chunk 4}\\end{align*}\\]Given this result, we would then store the value associated with the key $4,234,234,421$ in bin 226 (this is the decimal equivalent of the bit string computed above).Division HashingIn division hashing, we typically choose $m$ to be a prime number (we also require that $m$ not be too close to a power of $2$, see this reference for an explanation).  Our hash function now becomes $h(k) = mod(k, m)$, where $mod$ is the modulo operation.  Exercise 4Let’s examine why we might want to choose our table size to be a prime number.  Suppose we are hashing the first 50 non-negative even numbers (0 through 98).  Let $h_1(k) = mod(k, 13)$ and $h_2(k) = mod(k, 16)$.  Show that despite the $h_1$ using fewer bins, it will result in better utilization of its bins than $h_2$.More Hashing AlgorithmsWe won’t over these, but they are here for reference.Murmur Hash (this is supplementary,  we won’t get to it)Admittedly, I haven’t looked into Murmur Hash in any detail, but  I did find some useful resources to understand this algorithm.  I thought folks might be interested in reading about a hashing algorithm used in practice.  If you want to look into it and want to report back next class, please let me know.Cuckoo Hashing (this is supplementary,  we won’t get to it)Cuckoo hashing is another interesting seeming technique (again, I haven’t looked into it too much, but the basic idea is intriguing).  If you want to look into it and want to report back next class, please let me know.",

        "title": "Day 16: Lempel-Ziv",
        "author": "",
        "category": "",
        "content": "Some Additional Notes From Last TimeWhy a prime number-sized hash table could be a good thingI didn’t have the right result to describe why using a prime number can handle the case where the numbers you are hashing are all multiples of a single number $k$ (e.g., for even numbers $k=2$).  The result can be formalized using the notion of generators of groups (and that is not something you need to know in this class, but you could learn about it in Sarah’s class next semester).  In this Wikipedia article, see the section on “Integer and modular addition.”  The article states that if $k$ is relatively prime to the modulus number $n$, then repeatedly adding $k$ to itself will cover all the slots in our hash table.  (Note: $n$ is relatively prime to $k$ if the greatest common divisor of $n$ and $k$ is 1).Let’s try a simple example.  Let’s set $n=7$ and $k=4$.\\[\\begin{align*}4 &amp;\\equiv 4\\text{ (mod 7)} \\\\4 + 4 &amp;\\equiv 1\\text{ (mod 7)} \\\\4 + 4 + 4 &amp;\\equiv 5\\text{ (mod 7)} \\\\4 + 4 + 4 + 4 &amp;\\equiv 2\\text{ (mod 7)} \\\\4 + 4 + 4 + 4 + 4 &amp;\\equiv 6\\text{ (mod 7)} \\\\4 + 4 + 4 + 4 + 4 + 4 &amp;\\equiv 3\\text{ (mod 7)} \\\\4 + 4 + 4 + 4 + 4 + 4 + 4 &amp;\\equiv 0\\text{ (mod 7)} \\\\4 + 4 + 4 + 4 + 4 + 4 + 4 + 4 &amp;\\equiv 4\\text{ (mod 7)}\\end{align*}\\]How do I hash non-integer data?Kotlin defines a function called .hashCode() that turns any data into a number that can be used for hashing.Lempel-Ziv CompressionOne of the options for the current assignment is to implement Lempel-Ziv Compression.  Lempel-Ziv is a lossless compression algorithm, which means that the original data can be recovered exactly (without any loss of information) from the compressed data.There are a number of different variants of Lempel-Ziv, but the one we’re going to talk about in class today is the simplest to implement.It’s also worth noting that Lempel-Ziv is an optimal algorithm for lossless compression in a certain information-theoretic sense.  We likely won’t have time to go over the details of this in class, but if you are interested you may consider looking at this Wikipedia article that presents the sense in which the algorithm is optimal and links to some external sources that explore this topic in more depth.  The main article is Peter Shor’s notes that are also linked below.  If there is time, and people are interested, I’ll go over a quick explanation of the claim at the end of class.EncodingWe start with a stream of symbols and a codebook.  I’m going to use this string from Peter Shor’s notes on the topic.  AABABBBABAABABBBABBABBIn Lempel-Ziv (LZ) compression, we will also maintain a codebook. The codebook is going to be a mapping from strings to integers.  The strings (the keys) will represent the symbols from our data source and the integers (the values) will be unique identifiers that will help us compress the key. In some variants we start by creating a codebook entry for every possible symbol (letter) in our string.  In this version, we’re going to start with a single mapping $\\epsilon \\rightarrow 0$.  As we scan through the string we’ll adaptively add new mappings to our codebook as we encounter particular patterns.Next, we’re going to start scanning through the symbols of our string one-by-one and occasionally building the compressed representation of the data.  Our strategy will be to look for the longest substring that has yet to be compressed and is represented in our codebook.  As we scan our symbols, as long as these strings are in our codebook, we just keep moving through the data.  Once we find that the string is not in the codebook, we do two things  We add a new codeword  We output the compressed representation of the data.Let’s work through our example on the board.  If you’re not in-class today, I’ll point you to this video of a worked example of the same string.  It’s a little different from what I’ll do in class, but you’ll get the same main idea.Now we’ll go through the example on the board.What questions arose for you from this demonstration?  Exercise 1  Choose your own string to encode and go through the steps of Lempel-Ziv.  Before you start, take a second to think about what characteristics of the string might make it a more interesting example.DecodingLet’s go through the process of decompressing the string that we compressed in our original example.  To do so, we’ll scan through the compressed data and build the codebook and output the uncompressed data.Practical Considerations for Implementing this in KotlinWhen I wrote my own implementation, I found that it took me a while to figure out how to actually encode the data to binary (even though getting the codebook was fairly straightforward).  I found a nice helper class from Princeton that made the process a lot easier.  For your convenience, I (more accurately IntelliJ with some help from me) translated it into Java.  I modified the original design a bit to arrive at this version.The important functions in here are the following:/** * Writes the specified bit to the output binary data. * @param x the `boolean` to write. */fun write(x: Boolean) {}/** * Writes the *r*-bit int to the output binary data. * @param x the `int` to write. * @param r the number of relevant bits in the char. * @throws IllegalArgumentException if `r` is not between 1 and 32. * @throws IllegalArgumentException if `x` is not between 0 and 2&lt;sup&gt;r&lt;/sup&gt; - 1. */fun write(x: Int, r: Int) {}/** * @return the output as a byte array */fun toByteArray(): ByteArray {    return out.toByteArray()}/** * @return the output as a sequence of bytes that represent a string of * 0's and 1's */fun toBinaryString():ByteArray? {}",

        "title": "Day 17: Binary Search Trees",
        "author": "",
        "category": "",
        "content": "OverviewToday, we will learn about the binary search tree (BST).  We will find that BSTs are incredibly useful for searching for items within a collection.  Further, if we want to do things like find the closest element in our collection to a specific query, BSTs will give us great performance.Review of Our Data StructuresLet’s do a quick review of the data structures we’ve seen so far and recall their time complexities.We’ll fill them out together, and I’ll update the website after with the finished table.  Exercise 1  Create a table with the $\\Theta$ runtime for each data structure (Array, Linked List, Hash Table, Heap) at performing the operations insert, delete a specific element, lookup (exact), and lookup (closest).  Some data structures do not naturally support some operations, so you can either mark those as N/A or use $\\Theta(n)$.  The operation Lookup (closest) means to find the closest element to a query within the collection.  Note: some of my answers (below) are open to interpretation (e.g., depending on how you implement a particular data structure, some answers may differ).Show / Hide Solution to Exercise 1                  Data Structure       Insert       Delete       Lookup (exact)       Lookup (closest)                       Array       $\\Theta(1)$       $\\Theta(n)$       $\\Theta(n)$       $\\Theta(n)$                 Linked List       $\\Theta(1)$       $\\Theta(n)$       $\\Theta(n)$       $\\Theta(n)$                 Heap       $\\Theta(\\log n)$       $\\Theta(\\log n)$       N/A (typically not supported)       N/A (typically not supported)                 Hash Table       $\\Theta(1)$       $\\Theta(1)$       $\\Theta(1)$       $\\Theta(n)$         Linear and Binary SearchWe’ve seen these concepts in some form already this semester, but let’s make sure we have them at the forefront of our minds.Suppose we have a collection integers stored in an array $x_1, x_2, \\ldots, x_n$.  Further, let’s suppose the array is sorted in ascending order (i.e., $x_i &lt; x_j$ if and only if $i &lt; j$).  Now suppose given a query point $x_q$ we’d like to find the element in our array that satisfies the following equation.$\\begin{aligned} x^\\star &amp;= \\underset{i}{\\text{argmin}} | x_i - x_q | \\end{aligned}$This equation is just a fancy way of saying that we look for the closet (in this case as defined by the absolute value) between the query and the elements in the collection.Here are two ways to find the closest element in the array.Linear SearchThis one is simple.  We loop through the collection constantly comparing each element to the query.  We remember the closest match we’ve seen so far, and we update it if we find a closer match.  As you can probably see, this operation would have a cost of $\\Theta(n)$.Binary SearchBinary search works by eliminating half of the elements as candidates for our search at reach step.  If we are looking for an exact match to our query, we can repeatedly divide our input list into three parts, consisting the left elements, the middle element, and the right elements.  By comparing the middle element to the query, we can determine which of the left or right elements to search for to find our query (see the Wikipedia page on Binary Search algorithm for pseudocode on how to implement this).  Using the tools we saw in the divide and conquer portion of this class (e.g., the master theorem), we can show that this procedure has a $\\Theta(\\log n)$ running time.  Exercise 2  We have not yet addressed the problem of looking for the closest element in the array (we have only shown how to find the element exactly). How could we modify our search procedure to find the closest element to $x_q$?  You don’t have to write out full pseudocode.  Can you describe the technique at a high-level?  There is more than one way to address this problem, so if your approach doesn’t match the hint, that’s okay!  Show / Hide Hint 1  You may find the concept of predecessor and successor to be useful here.  The successor of $x_q$ is the closest element in the collection that is larger than $x_q$.  The predecessor is the closest element in the collection that is smaller than $x_q$.  Show / Hide Hint 2  Either the predecessor or the successor is guaranteed to be the closest to the query.   Exercise 3  Suppose we now want to support the ability to add new elements to our collection while still maintaining our sorted list (and getting the great $\\Theta(\\log n)$ runtime).  What is the time complexity of adding (or deleting) elements from our array while maintaining the sorted order?Meet the Binary Search TreeBSTs are data structures that allow us to maintain $\\Theta(\\log n)$ search (either exact or approximate) while providing $\\Theta(\\log n)$ insertion and removal.  The basic idea is to change the storage of our sorted data from an array to a tree.Original sorted data: $1, 2, 5, 8, 20, 100, 202$.As a BST:graph TB  8 --&gt; 2  8 --&gt; 100  2 --&gt; 1  2 --&gt; 5  100 --&gt; 20  100 --&gt; 202This tree maintains the invariant that for a given node, each of the nodes in the left subtree is less than that node.  Similarly, the nodes in the right subtree are each greater than this node.  Note that if the array has duplicate values, you can arbitrarily place the duplicate in either the left or right subtree.The benefit of the binary search tree is that we can easily add elements to the tree while maintaining the BST invariant (that smaller nodes are always in the left subtree and that larger nodes are always in the right subtree).  Exercise 4  After inserting  6, 7, and 21 (in that order), what would our BST look like?  In constructing your answer, you do not need to move any of the existing nodes.  Rather, you can attach new nodes to the leaves of the trees.Maintaining BalanceThe issue we’ll run into with the scheme we used in problem 4, is that if we get unlucky, we’ll end up with a highly unbalanced tree.  A tree is unbalanced if there are significantly different numbers of nodes in the left and right subtrees of its nodes.  Formally, we say that for any node in the tree, its left and right subtrees have heights that differ by at most 1.  Notice how this definition rules out certain pathological trees like a long chain of sorted numbers where the left subtree is always empty.There are several commonly used schemes to maintain balance in BSTs.  The two most common methods are AVL trees and Red-Black Trees.Red-Black TreesRed-Black trees have the following properties.  Each node in the tree is colored either red or black.  The root is black and any leaves (corresponding to null values) are black.  If a node is red, then both its children are black.  The number of black nodes encountered on any path from the root to a leaf (null) is equal.I really like Michael Sambol’s video series explaining the Red-Black tree.  We’ll watch some of the videos together, but I’ll leave it to you to watch the whole set.Playlist of Michael Sambol’s Red-Black tree videosTogether, we’ll watch the first four videos (with an exercise as an intermediary).  Main Idea and Structure  Exercise 5:  We’ll try to solve this as a class  Suppose you are given a valid red-black tree of with $n$ nodes, show that searching for an element in this tree takes time $\\Theta(\\log n)$.  Show / Hide Hint  You may find it easier to show that Red-black trees have heights less than $2 \\log_2(n+1)$.  From this fact you should be able to establish the running time you are after.   Rotations  Insertions (strategy) (note: there is an error at 3:27 where you would have to apply case 3 to fix the node “A”. This is discussed in the comments of the video).Here are some additional resources to help you think through the information covered in these videos.First, here is an animation that shows the rotation procedure on a red-black tree.Source: Wikimedia CommonsWhen inserting nodes into an RB-tree we follow the following process:  Insert the node into the appropriate location in the tree (based on the BST property) and color it red. Question for the class: which of the four properties above could be violated after this step?  Match the current state of the tree to the one of four cases (labeled case 0, case 1, case 2, or case 3).  Perform a remedial action (recoloring and/or rotation) based on the specific case.  See below for cases.  Check to see if there are additional violations higher up the tree.Here are the cases when inserting the node $z$:  Case 0: the node was inserted as the root.  Case 1: $z$ has a red uncle  Case 2: $z$ has a black uncle (triangle)  Case 3: $z$ has a black uncle (line)Here is the pseudocode for fixing up the red-black tree following an insertion.Source: CLRS Textbook  Exercise 6  Given the RB tree below, insert the value 4.  Use the pseudocode above to fix the RB-tree properties.  As you go, keep track of which properties are violated.  Source: CLRS textbookShow / Hide Solution  Source: CLRS textbook  Exercise 7  Using exercise 6 as an example, argue that the modifications to the tree move the potential violation closer to root while removing the violation farther from the root.  Consider the application of case 2 and case 3 to be a single step for the purposes of this question.",

        "title": "Day 18: Nearest Neighbor Search and K-d Trees",
        "author": "",
        "category": "",
        "content": "Nearest Neighbor Search  Nearest neighbor search (NNS), as a form of proximity search, is the optimization problem of finding the point in a given set that is closest (or most similar) to a given point. Closeness is typically expressed in terms of a dissimilarity function: the less similar the objects, the larger the function values. – Wikipedia page on Nearest Neighbor SearchThis algorithm is handy in a wide variety of data analysis, computer graphics, video game, computer vision, and machine learning tasks.  Specific examples include data classification, clustering, template matching, photogrammetry, and 3D modeling.The nearest neighbor algorithm consists of a set of training points $x_1, \\ldots, x_n$ with each $x_i \\in \\mathbb{R}^k$ (i.e., each point has $k$-dimensions).Given a query point, $x_q$ (with $x_q \\in \\mathbb{R}^k$), the nearest neighbor is defined as the closest point in our set of training points, where closeness is given by some distance function.  The distance function could be Euclidean distance, Manhattan distance, or something more exotic.  Exercise 1  What is the time complexity, $\\Theta$, of finding the nearest neighbor to the query point in terms of the number of training points $n$ and the dimensionality $k$ of the data?  How does this time complexity compare to the special case of using a red-black tree for the special case of $k=1$?K-d Trees (construction)Given the fact that we were able to dramatically speed up our search for the closest point in 1-dimension with the Red-Black tree, it is natural to ask the of question of whether there is a way to use the same ideas to speed up the search for the nearest neighbor to some query point.  The answer to this question is “yes… maybe”.  Next, we’ll see a structured called K-d trees, which can, in some conditions, speed up nearest neighbor search.  To build a K-d tree, we are given a set of $k$ dimensional points (e.g., represented in Kotlin as an Array of DoubleArray objects). The algorithm works as follows.  Compute the median along dimension 0.  Divide your points into two sets.  The first set consts of those points whose value along the $0$th dimension is less than the median.  The second set consists of those points whose value along the $0$th dimension is greater than or equal to the median.  Recurse on each of the two sets.  That is, you will want to repeat the procedure above but use only those points in a particular set and this time choose the $1$st dimension to split on.  Continue recursing until there is just a single in a set.  As you recurse increment the dimension to split on by 1.  If you run out of dimensions, split on dimension 0 again.  Exercise 2  Create a k-D tree from given the following points.  Sketch your result on a whiteboard.$x_1 = (1, 5), x_2 = (-1, 2), x_3 = (4, 4), x_4 = (2, 0), x_5 = (-3, -3), x_6 = (9, 1), x_7 = (4, 1), x_8 = (3, 8)$      Exercise 3  How would you represent this tree in Kotlin?  What classes would you use?  What would the basic flow be of your function to construct the tree? Don’t start coding!  Sketch it out with people around you.k-D Tree SearchNext we’re going to work on the problem of how to search through a k-D tree to find the closest point to a query.  Instead of giving you the procedure, let’s go through a series of exercises to discover it ourselves.  Exercise 4  Let’s start by searching using a strategy similar to how we would search through a binary search tree.  Given a query point $x_q$, go through your tree by comparing the appropriate dimensions of $x_q$ to the median computed along that dimension when constructing the tree.  When you arrive at a leaf node, return the point stored there as your nearest neighbor.  Given the points in exercise 3 (or come up with your own), show the result of running that procedure on some input.  Can you construct an input where the procedure would return the incorrect nearest neighbor?  Exercise 5  In order to fix the procedure in exercise 4, we are going to have to consider searching through other branches of our tree.  Suppose you follow your procedure from exercise 4, and when you get to a leaf, you store the point and the distance from the query to that point.  Now pop up to the previous node, determine a test you can perform to see if it’s worth searching the branch you haven’t searched yet.Approximate Nearest Neighbor (ANN) SearchYou might ask whether there is a way to get a speedup to your nearest neighbor search even when the data dimensionality is large.  It turns out that there is a very active field of research into approximate nearest neighbor search (ANN).  If you are willing to live give up the guarantee that the value returned will always be the closest point, you can get a substantial speedup.The graph linked on this page shows the recall rate and the number of queries per second for a given algorithm.  In this experiment, recall means the probability that one of the actually 100 nearest neighbors to a point was included in the list of the 100 nearest neighbors returned by a particular ANN algorithm (1.0 is perfect).  Higher queries per second (y-axis indicates better efficiency).How do these techniques work?  It is an area that I don’t have a lot of familiarity with, so I can only tell you a bit (maybe this could be a topic for a final project?).  One technique that I did want to highlight since it touches on the course material, is locality-sensitive hashing.  There is a really nice writeup of doing locality-sensitive hashing on text data at Pinecone.io.The one thing I wanted to highlight is the difference between locality-sensitive hashing (LSH) and the sort of hashing we do in the creation of a hash map.  In direct opposition to what you want in creating a hash map, In the case of LSH you want to maximize the chance of collision (when you have similar data).  By maximizing collisions between similar inputs, you have a chance can quickly narrow down your nearest neighbor search by applying your hash function and looking in the returned bin.I have created a Colab notebook to explore the performance of Meta’s library faiss for exact and approximate nearest neighbor.",

        "category": "",
        "content": "Concept Mapping DSA (30 minutes)  Exercise 1  With at least two other people (assuming you are in class), create a concept map for this semester thus far in DSA.  We’ll do a quick share out.Charting Your Learning (20 minutes)  Exercise 2  Look back to your learning goals you had at the beginning of the semester (I emailed each person what they wrote on the survey).  How have you been progressing with respect to these learning goals?  Try to jot down a few notes with respect to each of your learning goals.  Look back on your effective learning strategies (assignment 1).  How have these been going?  Take about 5-7 minutes to think individually, and then share with those around you.Charting the Course for the Rest of the Semester (50 minutes)Data Structures and Algorithms is obviously a vast topic.  As we enter the last bit of the course, which has much more flexibility, you’ll need to figure out how you want to extend / deepen your knowledge.  Perhaps you already know exactly what you want to do, but I suspect many folks would benefit from looking into some resources.  Here are some jumping off points I’d like to share.  (we didn’t cover the whole book, but you can choose what to fill in)CLRS Table of Contents  (A firehose of potential topics) Dictionary of Algorithms and Data Structures  (Some topics that get covered at the grad level) MIT Advanced Algorithms Class  (the research frontier in an incredibly prestigious conference) Proceedings of the 2023 Annual ACM-SIAM Symposium on Discrete Algorithms (SODA)  (specific jumping off points for machine learning fairness) Fairness and Machine Learning  (specific jumping off points for optimization) Boyd’s Book on Convex Optimization",

        "title": "Day 23: Final Project Workday",

        "category": "",
        "content": "AnnouncementsOral Quiz 2Please remember to sign up for a slot for your oral quiz (link is in the Canvas assignment page).  This assignment may not be done late unless you are seriously ill or have a specific accommodation.Reminder: final project deliverablesIf you haven’t already, please turn in your final project check-in 1 assignment.  If we spoke in class, but you didn’t turn in the written part, please indicate that as a comment on the Canvas assignment (I will waive the late penalty if this was the case).Oral Quiz 2 Topic List (and some time for review)As a reminder, this is the scope of the quiz.  This quiz covers the material in the class post assignment 4 (Divide and Conquer, Associative Arrays and Hashing, and KD-Trees / Binary Search Trees).  If something was marked as optional, it will not be part of the quiz.To help you in your studying, here are a list of things we covered in this part of the class.  We continued to explore the idea of divide and conquer algorithms.  We saw some problems on day 10 that used this idea.  You implemented Strassen’s algorithm and compared its performance to the typical, $\\Theta(n^3)$ approach.  We also can understand its runtime by using the master theorem.  We learned about dynamic programming as a systematic way to solve problems (see day 10).  We did some practice problems involving changemaking as well as stairclimbing.  On day 11 we did some more practice problems.  There are also some problems on day 12.  You learned about the problem of DNA sequence alignment and implemented either Needleman-Wunsch or Smith-Waterman.  We learned about the notion of an associative array and saw two strawman methods of implementing one (association lists and array maps).  We learned about the concept of a hashing function and showed how it could be used to create an associative array (either with separate chaining or direct addressing).  We learned about the computational complexity of various operations on a hash map.  We learned about the Lempel-Ziv algorithm and how it can be used as a lossless compression algorithm.  You implemented an associative array using a hash table.  You also either implemented Markov text analysis or Lempel-Ziv encoding.  You learned about the concept of a binary search tree, the notion of balance in a binary search tree, and how balance relates to runtime of looking for an element in the tree.  You learned about red-black trees, tree rotations, and how the properties of a red-black tree can be maintained by performing recoloring and rotation.  You learned about the nearest neighbor search and k-d trees.  You implemented your own k-d tree and explored how the runtime of k-d trees compared to brute-force search as the number of points and the dimensionality of the data change.WorktimeLet’s use today to keep momentum on final projects.",
        "url": "/in_class/day23.html"
      },"in-class-day26-html": {
        "title": "Day 26: Last Regular Class!",
        "author": "",
        "category": "",
        "content": "Getting Ready for the Final EventThe main part of the final event is presenting your final projects.  Make sure to consult the final project assignment page for information on the length of the presentation and intended format.  It is my hope that these presentations will summarize not only what you did, but give folks some insight into the algorithm you learned about.P versus NPI had talked about doing some brief discussions on algorithms during the project work period.  I wanted to take this last class to talk about probably the most famous problem in computer science P versus NP (this is also one of the Millenium Prize problems).  I’m guessing this is a problem that many folks have heard a bit about (possibly a lot about).  Let’s end the semester with establishing a little bit of common knowledge regarding P and NP.Before we start define P versus NP, we need to talk about what we mean by each of these classes.  First, what is P?  We can think of P as a set of decision problems.  A decision problem is a special case of an algorithm where we are deciding something interest (i.e., the output is a 0 or 1).  We haven’t dealt with too many of these problems this semester, but many of the problems we’ve studies thus far can be cast as decision problems.P is the set of all decision problems such that there is an algorithm to solve them in $\\Theta(n^k)$ where $n$ is the size of the input and $k$ is some finite number.  That is to say, there is an algorithm that runs in polynomial time to solve the decision problem.NP is the set of all decision problems  such that there is an algorithm to verify a proposed solution in $\\Theta(n^k)$ where $n$ is the size of the input and $k$ is some finite number.  That is to say, there is an algorithm that runs in polynomial time to verify a candidate solution to the decision problem.To get a handle on NP problems, let’s consider the knapsack problem.  Given a bunch of weighted items, $w_1, w_2, \\ldots, w_n$ determine whether there is a partition of these items into two knapsacks such that the weight of the two knapsacks is identical.  If we were given a possible solution to this problem, we could easily verify if it was true or not (how?).  While we can verify a solution to this problem in polynomial time, we don’t yet have a way to generate the solution in polynomial time.  If you could figure out such a solution, you would be a billionaire, win the Turing award, and maybe win a Fields medal.The knapsack problem is part of a set of problems called the NP-Complete problems.  These are problems that are known to be at least as hard as any of the problems in NP.  We show that they are at least as hard using the idea of a reduction.Right now it is unknown whether the two sets P and NP are the same.  Here are two possibilities.Proving whether P is equal to NP has not been easy.  There have been many papers published that purport to address the question, but none are widely accepted in the field.  I’ve even heard that some journals have limits on how many papers per year someone can submit on the question of P versus NP.Final push on projectsLet’s do it.",
        "url": "/in_class/day26.html"

        "content": "I give you freedom in this course to set up your GitHub repository how you see fit.  I do, however, recommend that you use GitHub (or at least Git as a way to version control your code).One way to organize your work in this class is to make a single top-level repository and then put individual assignment and project repositories below it.  Here is an example of how the sample solutions repository looks (after posting the day 4 solution).├── Class01 (note: this is a project)│   ├── .idea│   │   ├── .gitignore│   │   ├── encodings.xml│   │   ├── kotlinc.xml│   │   ├── misc.xml│   │   └── vcs.xml│   ├── src│   │   ├── main│   │   │   └── kotlin│   │   │       └── Main.kt│   │   └── test│   │       └── kotlin│   │           └── FindPeakTest.kt│   ├── .gitignore│   └── pom.xml├── Class04 (note: this is a project, separate from Class01)│   ├── .idea│   │   ├── .gitignore│   │   ├── encodings.xml│   │   ├── kotlinc.xml│   │   ├── misc.xml│   │   └── vcs.xml│   ├── src│   │   ├── main│   │   │   └── kotlin│   │   │       ├── Main.kt│   │   │       └── Stack.kt│   │   └── test│   │       └── kotlin│   │           └── MyStackTest.kt│   ├── .gitignore│   └── pom.xml├── Class04Optional (note: this is a project, separate from Class04)│   ├── .idea│   │   ├── .gitignore│   │   ├── encodings.xml│   │   ├── kotlinc.xml│   │   ├── misc.xml│   │   └── vcs.xml│   ├── src│   │   └── main│   │       └── kotlin│   │           ├── Main.kt│   │           └── MutableStringList.kt│   ├── .gitignore│   └── pom.xmlSteps to Achieve the Setup Above  Make sure you have git set up properly on your computer (meaning you can run git at a terminal, and it responds with some output)  Make sure you can clone your repos from GitHub with write permissions (e.g., by adding an ssh key to your account and to your machine)  Create a repo on GitHub for your class work.  You can initialize it with a README file.  Clone your repo on your machine with write access (e.g., using ssh).  When you         "content": "Problem 1: Breadth-first and Depth-first SearchThe following code can be used to implement both depth-first and breadth-first search by choosing a particular data structure for priorityList.  Which data structure would you choose for priorityList to implement breadth-first search?  How about for depth-first search?  Choose one of these algorithms and show an example of how it would play out on the whiteboard.toVisit ← {}priorityList ← []priorityList.add(root)toVisit.add(root)while priorityList is not empty:    n ← priorityList.popHighestPriorityElement()    if n == target:        return true // path exists    for all neighbors m of node n:        if m is not in toVisit:            priorityList.add(m)            toVisit.add(m)return false // no pathProblem 2: Heap SortHeap sort is a sorting algorithm where given a list of $n$ items $x_1, x_2, \\ldots, x_n$, each item is first inserted into a binary min heap.  Next, we call pop min repeatedly to extract the elements in sorted order.What is the $\\Theta$ running time of heap sort?  Justify your answer.Problem 3: Doubly Linked Lists  Draw a picture of a doubly linked list.  Explain how it differs from a singly linked list  What are the $\\Theta$ running times of the following operations (justify your answers).          pushFront      pushBack      popFront      popBack      Search the list to determine whether a particular element is present in the list.      Problem 4: Explain Your Sorting CodeLet’s pull up an implementation of one of your sorting algorithms.  Please explain how your code implements the particular algorithm you chose.  What is the $\\Theta$ runtime of this particular sorting algorithm.",

        "content": "Problem 1: Stack CodeHere is an implementation of a stack in Kotlin.  Explain how the code works.  Your response should touch on the role of T, the definition of top (and why it has a nullable type), and how each of the functions works.class MyStack&lt;T&gt;: Stack&lt;T&gt; {    private class StackNode&lt;T&gt;(val data: T,                               var next: StackNode&lt;T&gt;?)    private var top: StackNode&lt;T&gt;? = null    override fun push(data: T) {        top = StackNode&lt;T&gt;(data, top)    }    override fun pop(): T? {        val returnValue = top?.data        top = top?.next        return returnValue    }    override fun peek(): T? {        return top?.data    }    override fun isEmpty(): Boolean {        return top == null    }}Problem 2: Order of GrowthExplain why selection sort (finding the min and putting it at the beginning of the list, finding the second-smallest element and putting it in the second position in the list, etc.) is $\\Theta(n^2)$.Explain the merge sort algorithm and why it has a running time of $\\Theta(n \\log n)$.Problem 3: Binary HeapsOn the whiteboard, explain the concept of a binary heap.  Explain what the heap invariant property is.  Demonstrate how to insert a new element into a binary heap.  Explain why binary heaps are well-suited to implementing priority queues.Problem 4: Broken DijkstraThe pseudocode for Dijkstra’s algorithm is incorrect.  Explain what is wrong with it and how you would fix it.  The code finds the length of the shortest path from source to target.for each vertex, v that is not the source:    dist[v] ← INFINITY    queue.addWithPriority(v, INFINITY)dist[source] ← 0queue.addWithPriority(source, 0)while queue is not empty:    u ← pop min priority element from queue    for each neighbor v of u still in queue:        alt ← dist[u] + edgecost(u, v)        if alt &lt; dist[v]:            dist[v] ← altreturn dist[target]",

        "title": "Getting Set With Kotlin",
        "author": "",
        "category": "",
        "content": "## Install IntelliJ IDEWe'll be working with the [Kotlin language](https://kotlinlang.org/) (more information and history of the language available [through Wikipedia](https://en.wikipedia.org/wiki/Kotlin_(programming_language)).  The best way to get Kotlin for your computer it install the IntelliJ IDE by JetBrains.  While you can use other IDEs with Kotlin (e.g., VS Code), we strongly recommend you stick IntellIJ (as that is the official IDE for Kotlin).  You can get a free license for Jetbrains since you are part of an academic institution.The [Getting Started page](https://kotlinlang.org/docs/getting-started.html) on the Kotlin website is the place to go to get started on your journey.  As you go through the instructions, make sure to click on the link that says ``IntelliJ IDE``.You should also take advantage of the fact that students can get free access to IntelliJ Ultimate.  This page has some [information on how to get started with accessing these student benefits](https://www.jetbrains.com/academy/student-pack/).## Hello WorldLet's work together to create our first Kotlin Program.  Open up IntellJ, select `File` then `New` then `Project`.Next, make sure you've selected  `Kotlin` as your language  and `Add sample code` should be checked.  Your JDK may look different from what is shown here, that's probably fine (but let me know if you run into issues).  For `Build System`, you can select any of them but Maven seems to work well in my experience).  See below for a screenshot of the new project dialog.![A screenshot of the IntelliJ IDE showing the selection of Kotlin as the programming language](/images/new_project.png)After you click `Create`, a window will open up with your new project.  It should look something like this.![A screenshot of the IntelliJ IDE showing the default project code](/images/configured_project.png).To run this program, click the arrow button near the `Current File` drop down.  You should get output that looks like this.```\"/Applications/IntelliJ IDEA.app/Contents/jbr/Contents/Home/bin/java\" -javaagent:/Applications/IntelliJ IDEA.app/Contents/lib/idea_rt.jar=61644 -Dfile.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -classpath /Users/pruvolo/Downloads/HelloWorld/out/production/HelloWorld:/Users/pruvolo/.m2/repository/org/jetbrains/kotlin/kotlin-stdlib/2.2.0/kotlin-stdlib-2.2.0.jar:/Users/pruvolo/.m2/repository/org/jetbrains/annotations/13.0/annotations-13.0.jar MainKtHello, Kotlin!i = 1i = 2i = 3i = 4i = 5Process finished with exit code 0```You might be wondering what the red circle is for.  This is a breakpoint that would stop execution of your program if you were to run it under the debugger.  To test this out, click the icon of the bug (right next to the arrow).  IntelliJ will now look like this.![The IntelliJ debugger stopped a breakpoint](/images/debugger.png)Note that the values of the local variables are shown along with the line of code we are executing.  You can continue execution of the program using the ``resume program`` button.  For a more indepth look at the debugger, consult [the IntelliJ documentation on debugging](https://www.jetbrains.com/help/idea/debugging-code.html).## Adding a Dependency on a LibraryThe process for adding a dependency on a third party library (e.g., to add some functionality not present in the Kotlin standard library) will depend on the build system.  Here is an example of how to add a dependency for the `Maven` build system (as selected in the previous section).  This should also work for `Gradle` as well.> Before getting started, configure IntelliJ to automatically download documentation and source for any imported dependencies.  You can do this by going to `Settings` -> `Build, Execution, & Deployment` -> `Build Tools` -> `Maven` -> `Importing` and then checking Automatically download `Sources`, `Documentation`, and `Annotations`.You can approach this in two ways.  First, you can do an ordinary Google search to find your dependency.  For example, if I want to do linear algebra things in Kotlin, I could search `Linear algebra kotlin library'.  From this list, I can usually find some instructions on how to add the library as a dependency.  Alternatively, you can search for the dependency you want to add using the official [Maven Search engine](https://search.maven.org/?eh=) or, if you want a more user-friendly experience, a community-managed [Maven Search Engine Alternative](https://mvnrepository.com/).  If I type in Linear Algebra to the site above, I get the following output.![The search output from mvnrepository.com](/images/maven_search.png)Next, I can pick the library I want by clicking on it and choosing a version.  Let's choose the EJML Simple Library and select the latest version (`0.44`).  There will be a selector to choose the build system you are using.  In our example of using Maven build system we can add the dependency by selecting `Maven` from the tabbed selector, copying the XML fragment (which should look like the following), and pasting it into the `` section of `pom.xml`.```xml    org.ejml    ejml-simple    0.44.0```You will need to click the `Reload` button to complete the process.To work with our dependency, let's modify our code.  If we know a type in the imported module we want to use, we can type it and the editor will automatically suggest the appropriate class to import.  Go ahead and add the following lines to the top of main ```kotlinval q = SimpleMatrix(3, 3)q[0,0] = 3.0print(q)```Initially, the word `SimpleMatrix` will be red since it is not imported.  You can right-click on it and select `Context Actions` and choose `Import SimpleMatrix`.  This will add the appropriate import at the top of your code.What does this code actually do?  Let's access the documentation.  If you click on SimpleMatrix, you should see a pop-up with documentation of what that command does (in this case it creates a matrix with all 0's).  You can further explore the documentation by interacting with the links in the documentation snippet.Some useful keyboard shortcuts for interacting with the documentation and discovering how external libraries work is as follows.* Search Everywhere: Shift Shift * Quick Doc (automatically show documentation in a sidebar): macOS F1 (or Ctrl+J), Win/Linux Ctrl+Q * Go to Declaration / Implementation: ⌘B / ⌥⌘B (Win/Linux Ctrl+B / Ctrl+Alt+B)* Show Usages: ⌥⌘F7 (Win/Linux Alt+F7)* Parameter Info: ⌘P (Win/Linux Ctrl+P)* Navigate Class / Symbol: ⌘O / ⌥⌘O (Win/Linux Ctrl+N / Ctrl+Alt+Shift+N)## A Note about Variation in SetupIf you would like to configure your workflow differently to these steps, that is totally fine.  I leave it to you to make this decision, and I'll do my best to support you should you run into road blocks.",
        "url": "/how_to/setting_up_kotlin.html"
      },"how-to-useful-resources-html": {
        "title": "Useful Resources",
        "author": "",
        "category": "",
        "content": "## Kotlin Resources* [Running code snippets in Kotlin](https://kotlinlang.org/docs/run-code-snippets.html)* [Advent of Code in Idiomatic Kotlin](https://kotlinlang.org/docs/advent-of-code.html) will give you practice in efficiently solving problems with Kotlin.  I haven't watched these (except for the first one of the 2024 series), but they were recommended by a student from last year.  One caveat here is that the examples use idiomatic solutions, which means that they prioritize using language-specific conventions and tricks to solve problems rather than using the most straightforward methods.  While this approach is nice to level-up your Kotlin skills, don't be intimidated that you would have used a different strategy to solve the problems.",
